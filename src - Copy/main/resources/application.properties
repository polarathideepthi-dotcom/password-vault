# Port - Render icche PORT ni teesukuntundhi
server.port=${PORT:10000}

# Database - Render lo pette SPRING_DATASOURCE_URL ni teesukuntundhi
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/vault}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT - Render lo JWT_SECRET pettali, lekunte ee default vaduthundhi
jwt.secret=${JWT_SECRET:MySuperSecretKeyForVaultApp1234567890MySuperSecretKey}
jwt.expiration=${JWT_EXPIRATION:86400000}
